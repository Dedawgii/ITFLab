<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Card — JinxedDawg</title>

<style>
  /* ---------- Tokens : ส้ม + แดงพาสเทล ---------- */
  :root {
    --cream:      #fff7f2;
    --paper:      #fffaf7;
    --peach:      #ffe6d5;
    --peach-soft: #fff0e4;
    --apricot:    #ffc7a1;
    --tangerine:  #ff9a55;
    --orange:     #f4712f;
    --coral:      #ff8a75;
    --blush:      #ffd7cf;
    --red:        #e2503a;
    --deep:       #7c2d22;
    --shadow:     0 12px 34px rgba(226, 80, 58, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 16px;
    font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
    color: var(--deep);
    background:
      radial-gradient(circle at 15% 20%, var(--blush) 0%, transparent 45%),
      radial-gradient(circle at 85% 12%, var(--peach) 0%, transparent 42%),
      radial-gradient(circle at 55% 105%, var(--peach-soft) 0%, transparent 55%),
      var(--cream);
  }

  /* ---------- การ์ดเดียวทั้งหมด ---------- */
  #mainCard {
    width: 100%;
    max-width: 780px;
    background: var(--paper);
    border: 3px solid var(--apricot);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 26px 24px 24px;
  }

  .card-head {
    text-align: center;
    margin-bottom: 22px;
  }
  .card-head h1 {
    margin: 0;
    font-size: 1.6rem;
    color: var(--red);
    letter-spacing: 0.5px;
  }
  .card-head h1 span { color: var(--orange); }
  .card-head p {
    margin: 6px 0 0;
    font-size: 0.85rem;
    color: var(--orange);
    opacity: 0.85;
  }

  /* ---------- โปรไฟล์ | ทูดู เรียงข้างกัน ---------- */
  .card-body {
    display: flex;
    gap: 24px;
    align-items: stretch;
    flex-wrap: wrap;
  }

  /* ---------- PROFILE ---------- */
  #profileCard {
    flex: 1 1 240px;
    min-width: 240px;
    text-align: center;
    background: var(--peach-soft);
    border: 2.5px dashed var(--apricot);
    border-radius: 22px;
    padding: 24px 18px;
  }

  #profileImg {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 14px;
    border: 5px solid var(--tangerine);
    outline: 3px solid var(--blush);
    box-shadow: 0 6px 16px rgba(244, 113, 47, 0.28);
    transition: transform 0.25s ease;
  }
  #profileImg:hover { transform: rotate(-4deg) scale(1.04); }

  #profileName {
    margin: 0 0 12px;
    font-size: 1.28rem;
    color: var(--red);
    line-height: 1.35;
  }

  .info-list {
    list-style: none;
    margin: 0 0 14px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .info-list li {
    background: var(--paper);
    border: 2px solid var(--apricot);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--orange);
  }
  .info-list li b { color: var(--red); }

  #profileBio {
    margin: 0 0 16px;
    padding: 12px;
    background: var(--blush);
    border-radius: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.5px;
  }

  #instagramLink {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--coral), var(--orange));
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    text-decoration: none;
    box-shadow: 0 5px 14px rgba(226, 80, 58, 0.3);
    transition: transform 0.2s ease;
  }
  #instagramLink:hover { transform: translateY(-3px) rotate(-1.5deg); }

  /* ---------- TODO ---------- */
  #todoCard {
    flex: 1 1 300px;
    min-width: 280px;
    background: var(--paper);
    border: 2.5px solid var(--apricot);
    border-radius: 22px;
    padding: 24px 20px;
  }

  #todoTitle {
    margin: 0 0 16px;
    font-size: 1.15rem;
    color: var(--orange);
    text-align: center;
  }

  #todoForm {
    display: flex;
    gap: 9px;
    margin-bottom: 10px;
  }

  #todoInput {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--deep);
    background: var(--peach-soft);
    border: 2.5px solid var(--apricot);
    border-radius: 14px;
    outline: none;
    transition: 0.2s ease;
  }
  #todoInput::placeholder { color: var(--tangerine); }
  #todoInput:focus {
    border-color: var(--tangerine);
    background: #fff;
    box-shadow: 0 0 0 4px var(--blush);
  }

  #addBtn {
    padding: 11px 20px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--red), var(--orange));
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(226, 80, 58, 0.28);
    transition: transform 0.2s ease;
  }
  #addBtn:hover { transform: translateY(-2px) rotate(-1.5deg); }

  .hint {
    margin: 0 0 14px;
    font-size: 0.76rem;
    line-height: 1.5;
    color: var(--orange);
    opacity: 0.8;
  }

  #todoList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  #todoList li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--peach-soft);
    border: 2px solid var(--apricot);
    border-radius: 15px;
    padding: 10px 13px;
    font-size: 0.93rem;
    transition: 0.2s ease;
  }
  #todoList li:hover {
    background: var(--blush);
    border-color: var(--coral);
    transform: translateX(3px);
  }

  #todoList li label {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    cursor: pointer;
  }

  #todoList li input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  #todoList li .box {
    width: 23px;
    height: 23px;
    flex: 0 0 23px;
    border: 2.5px solid var(--tangerine);
    border-radius: 8px;
    background: #fff;
    display: grid;
    place-items: center;
    color: transparent;
    font-size: 0.8rem;
    font-weight: 700;
  }
  #todoList li input[type="checkbox"]:checked + .box {
    background: var(--coral);
    border-color: var(--red);
    color: #fff;
  }
  #todoList li input[type="checkbox"]:checked ~ .todoText {
    text-decoration: line-through;
    opacity: 0.55;
  }

  #todoList li .todoText { flex: 1; }

  .delBtn {
    border: none;
    background: var(--blush);
    color: var(--red);
    width: 27px;
    height: 27px;
    border-radius: 9px;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .delBtn:hover { background: var(--coral); color: #fff; }

  #todoCounter {
    margin: 14px 0 0;
    text-align: center;
    font-size: 0.8rem;
    color: var(--orange);
    opacity: 0.85;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 700px) {
    .card-body { flex-direction: column; }
  }
</style>
</head>

<body>

  <!-- ================= การ์ดเดียว ทั้งโปรไฟล์และทูดู ================= -->
  <div id="mainCard">

    <div class="card-head">
      <h1>Profile <span>&amp;</span> To-Do</h1>
      <p>JinxedDawg · 69070124 · IT</p>
    </div>

    <div class="card-body">

      <!-- ---------- PROFILE ---------- -->
      <section id="profileCard">
        <img
          id="profileImg"
          src="weverse_4-338944986.jpeg"
          alt="รูปโปรไฟล์ของ Pacharadol Sutthikankul (JinxedDawg)"
        />

        <h2 id="profileName">Pacharadol Sutthikankul</h2>

        <ul class="info-list">
          <li id="studentId">รหัสนักศึกษา : <b>69070124</b></li>
          <li id="major">สาขา : <b>IT</b></li>
        </ul>

        <p id="profileBio">JinxedDawg</p>

        <a
          id="instagramLink"
          href="https://www.instagram.com/cn.dwg/"
          target="_blank"
          rel="noopener"
        >📸 instagram.com/cn.dwg</a>
      </section>

      <!-- ---------- TODO ---------- -->
      <section id="todoCard">
        <h2 id="todoTitle">📝 To-Do List</h2>

        <form id="todoForm" onsubmit="return false;">
          <input
            type="text"
            id="todoInput"
            name="todo"
            placeholder="พิมพ์สิ่งที่ต้องทำ..."
            maxlength="80"
            autocomplete="off"
          />
          <button type="submit" id="addBtn">+ เพิ่ม</button>
        </form>

        <p class="hint">* รายการจะถูกบันทึกไว้ใน Local Storage และแสดงคืนอัตโนมัติทุกครั้งที่รีเฟรชหน้าเว็บ</p>

        <ul id="todoList">

          <li id="todo-item-1">
            <label for="todo-check-1">
              <input type="checkbox" id="todo-check-1" />
              <span class="box">✔</span>
              <span class="todoText">อ่านสไลด์เรื่อง Database Design</span>
            </label>
            <button type="button" class="delBtn" title="ลบรายการ">×</button>
          </li>

          <li id="todo-item-2">
            <label for="todo-check-2">
              <input type="checkbox" id="todo-check-2" checked />
              <span class="box">✔</span>
              <span class="todoText">ทำเว็บ Profile Card เสร็จแล้ว</span>
            </label>
            <button type="button" class="delBtn" title="ลบรายการ">×</button>
          </li>

          <li id="todo-item-3">
            <label for="todo-check-3">
              <input type="checkbox" id="todo-check-3" />
              <span class="box">✔</span>
              <span class="todoText">ฝึกเขียน Responsive Web Design</span>
            </label>
            <button type="button" class="delBtn" title="ลบรายการ">×</button>
          </li>

          <li id="todo-item-4">
            <label for="todo-check-4">
              <input type="checkbox" id="todo-check-4" />
              <span class="box">✔</span>
              <span class="todoText">อัปโหลดงานขึ้น GitHub</span>
            </label>
            <button type="button" class="delBtn" title="ลบรายการ">×</button>
          </li>

        </ul>

        <p id="todoCounter">ทั้งหมด 4 รายการ · เสร็จแล้ว 1</p>
      </section>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
